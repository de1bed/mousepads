<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
      <section data-screen-label="Catalog" style="animation: fadeIn 400ms ease-out">

        <div style="padding: 24px 48px; font-size: 13px; color: #6B6B6B; display: flex; gap: 8px">
          <a onClick="{{ goHome }}" style="cursor: pointer; color: #6B6B6B" style-hover="color: #000000; text-decoration: underline">{{ t.bcHome }}</a>
          <span>/</span>
          <span style="color: #000000">{{ t.catalogTitleCase }}</span>
        </div>

        <div style="padding: 24px 48px 48px 48px; border-bottom: 1px solid #E5E5E5; display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 48px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em">{{ t.catalogTitle }}</h1>
          <div style="display: flex; gap: 32px; flex: 0 0 auto">
            <sc-for list="{{ trustItems }}" as="tr" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 12px">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="flex: 0 0 auto"><path d="{{ tr.d }}"></path></svg>
                <span style="font-size: 13px; line-height: 1.4; max-width: 150px">{{ tr.txt }}</span>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="padding: 32px 48px 0 48px; border-bottom: 1px solid #E5E5E5; display: flex; gap: 40px; overflow-x: auto">
          <sc-for list="{{ catTabs }}" as="tab" hint-placeholder-count="6">
            <button onClick="{{ tab.pick }}" style="background: none; border: none; padding: 0 0 12px 0; font-family: inherit; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: {{ tab.color }}; cursor: pointer; border-bottom: 2px solid {{ tab.under }}; transition: color 200ms ease-out, border-color 300ms ease-out; white-space: nowrap; border-radius: 0" style-hover="color: #000000">{{ tab.label }}</button>
          </sc-for>
        </div>

        <div style="padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; gap: 24px">
          <button onClick="{{ openDrawer }}" style="display: flex; align-items: center; gap: 8px; background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; padding: 0; color: #000000" style-hover="opacity: 0.6">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"></line><circle cx="9" cy="7" r="2.5" fill="#FFFFFF"></circle><line x1="4" y1="17" x2="20" y2="17"></line><circle cx="15" cy="17" r="2.5" fill="#FFFFFF"></circle></svg>
            {{ t.filterBtn }}
          </button>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; cursor: pointer">
            {{ t.sortBy }}
            <select value="{{ catSort }}" onChange="{{ onSort }}" style="font-family: inherit; font-size: 13px; font-weight: 500; border: none; background: none; cursor: pointer; outline: none">
              <sc-for list="{{ sortOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.val }}">{{ o.label }}</option></sc-for>
            </select>
          </label>
          <span style="font-size: 13px; color: #6B6B6B">{{ catalogCount }}</span>
        </div>

        <div style="padding: 0 48px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 48px 24px; opacity: {{ gridOp }}; transition: opacity 300ms ease-out">
          <sc-for list="{{ catalogProducts }}" as="p" hint-placeholder-count="8">
            <div style="cursor: pointer; animation: fadeIn 400ms ease-out {{ p.delay }} both; transition: box-shadow 400ms ease-out" style-hover="box-shadow: 0 16px 32px rgba(0,0,0,0.10)">
              <div onClick="{{ p.go }}" style="position: relative; aspect-ratio: 36 / 17; background: #FFFFFF; overflow: hidden">
                <sc-for list="{{ p.images }}" as="im" hint-placeholder-count="1">
                  <img src="{{ im.src }}" alt="{{ p.name }}" loading="lazy" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{ im.op }}; transition: opacity 200ms ease-out, transform 400ms ease-out" style-hover="transform: scale(1.02)">
                </sc-for>
              </div>
              <div onClick="{{ p.go }}" style="margin-top: 16px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{ p.name }}</div>
              <div style="margin-top: 4px; font-size: 12px; color: #6B6B6B">{{ p.fromLabel }}</div>
              <div style="margin-top: 12px; display: flex; align-items: center; gap: 6px">
                <sc-for list="{{ p.swatches }}" as="sw" hint-placeholder-count="3">
                  <button onClick="{{ sw.pick }}" aria-label="Variant" style="width: 40px; height: 24px; background: {{ sw.color }}; border: 1px solid #E5E5E5; outline: {{ sw.outline }}; cursor: pointer; padding: 0; border-radius: 0" style-hover="outline: 1px solid #000000"></button>
                </sc-for>
                <sc-if value="{{ p.hasPlus }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 11px; color: #6B6B6B">{{ p.plusN }}</span>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ catalogEmpty }}" hint-placeholder-val="{{ false }}">
          <p style="padding: 0 48px; font-size: 14px; color: #6B6B6B">{{ t.noResults }}</p>
        </sc-if>

        <div style="padding: 96px 48px; display: flex; flex-direction: column; align-items: center; gap: 16px">
          <sc-if value="{{ canLoadMore }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ loadMore }}" style="height: 48px; padding: 0 40px; background: transparent; border: 1px solid #000000; border-radius: 0; font-family: inherit; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: all 200ms ease-out; color: #000000" style-hover="background: #000000; color: #FFFFFF">{{ t.loadMore }}</button>
          </sc-if>
          <span style="font-size: 12px; color: #6B6B6B">{{ showingLabel }}</span>
        </div>

        <sc-if value="{{ catDrawer }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ closeDrawer }}" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 70; animation: fadeIn 200ms ease-out"></div>
          <div style="position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 90vw; background: #FFFFFF; z-index: 71; padding: 32px; display: flex; flex-direction: column; gap: 32px; overflow-y: auto; animation: drawerIn 400ms ease-out">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">{{ t.filterBtn }}</span>
              <button onClick="{{ closeDrawer }}" aria-label="Close" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 4px 8px">×</button>
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px">{{ t.filterSurface }}</div>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{ drawerSurfaces }}" as="f" hint-placeholder-count="3">
                  <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer">
                    <input type="checkbox" checked="{{ f.checked }}" onChange="{{ f.toggle }}" style="width: 16px; height: 16px; accent-color: #000000; margin: 0">
                    <span>{{ f.label }}</span>
                  </label>
                </sc-for>
              </div>
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px">{{ t.filterPrice }}</div>
              <input type="range" min="0" max="150" step="5" value="{{ fPrice }}" onChange="{{ onPrice }}" aria-label="{{ t.filterPrice }}" style="width: 100%; accent-color: #000000">
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B6B6B; margin-top: 4px"><span>$0</span><span>{{ fPriceLabel }}</span></div>
            </div>
            <div>
              <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px">{{ t.sortByTitle }}</div>
              <select value="{{ catSort }}" onChange="{{ onSort }}" style="width: 100%; height: 44px; border: 1px solid #E5E5E5; border-radius: 0; font-family: inherit; font-size: 13px; padding: 0 12px; outline: none; background: #FFFFFF; cursor: pointer">
                <sc-for list="{{ sortOpts }}" as="o" hint-placeholder-count="4"><option value="{{ o.val }}">{{ o.label }}</option></sc-for>
              </select>
            </div>
          </div>
        </sc-if>
      </section>
</x-dc>
</body>
</html>
