<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
      <section data-screen-label="Contact" style="max-width: 640px; margin: 0 auto; padding: 64px 24px 96px 24px; animation: fadeIn 400ms ease-out">
        <h1 style="margin: 0 0 32px 0; font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em">{{ t.contactTitle }}</h1>
        <sc-if value="{{ contactSent }}" hint-placeholder-val="{{ false }}">
          <div style="border: 1px solid #E5E5E5; padding: 32px; font-size: 15px; font-weight: 600; color: #1F8A5B">{{ t.contactSentMsg }}</div>
        </sc-if>
        <sc-if value="{{ contactNotSent }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">
              {{ t.contactName }}
              <input style="height: 48px; border: 1px solid #E5E5E5; border-radius: 0; padding: 0 16px; font-family: inherit; font-size: 14px; outline: none" style-focus="border: 1px solid #000000">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">
              {{ t.contactEmail }}
              <input type="email" style="height: 48px; border: 1px solid #E5E5E5; border-radius: 0; padding: 0 16px; font-family: inherit; font-size: 14px; outline: none" style-focus="border: 1px solid #000000">
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em">
              {{ t.contactMsg }}
              <textarea rows="6" style="border: 1px solid #E5E5E5; border-radius: 0; padding: 12px 16px; font-family: inherit; font-size: 14px; outline: none; resize: vertical" style-focus="border: 1px solid #000000"></textarea>
            </label>
            <button onClick="{{ sendContact }}" style="height: 48px; padding: 0 32px; border: none; border-radius: 0; background: {{ ctaBg }}; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 200ms ease-out; align-self: flex-start" style-hover="background: {{ ctaHover }}">{{ t.contactSend }}</button>
          </div>
        </sc-if>
      </section>
</x-dc>
</body>
</html>
