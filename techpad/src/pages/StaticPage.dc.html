<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
      <section data-screen-label="Static page" style="max-width: 800px; margin: 0 auto; padding: 64px 24px 96px 24px; animation: fadeIn 400ms ease-out">
        <h1 style="margin: 0 0 32px 0; font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em">{{ staticTitle }}</h1>
        <sc-for list="{{ staticParas }}" as="p" hint-placeholder-count="3">
          <p style="margin: 0 0 20px 0; font-size: 15px; line-height: 1.8; color: #333333">{{ p }}</p>
        </sc-for>
      </section>
</x-dc>
</body>
</html>
