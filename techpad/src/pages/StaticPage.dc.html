<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
      <section data-screen-label="Static page" style="animation: fadeIn 400ms ease-out">
        <sc-if value="{{ hasStaticImg }}" hint-placeholder-val="{{ false }}">
          <div class="tp-about-hero" style="position: relative; width: 100%; min-height: 72vh; display: flex; align-items: flex-end; overflow: hidden; background: #0D0D0D">
            <img src="{{ staticImg }}" alt="" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%">
            <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.88) 100%)"></div>
            <div style="position: relative; z-index: 1; width: 100%; max-width: 880px; padding: 72px 48px 64px; color: #FFFFFF">
              <span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.72; margin-bottom: 16px">{{ staticEyebrow }}</span>
              <h1 style="margin: 0; font-size: clamp(36px, 6vw, 64px); font-weight: 700; text-transform: uppercase; letter-spacing: -0.03em; line-height: 0.98">
                <span style="display: block">{{ staticHeadA }}</span>
                <span style="display: block">{{ staticHeadB }}</span>
              </h1>
              <p style="margin: 22px 0 0; max-width: 520px; font-size: 16px; line-height: 1.65; color: rgba(255,255,255,0.82)">{{ staticLead }}</p>
            </div>
          </div>
          <div style="max-width: 800px; margin: 0 auto; padding: 64px 48px 96px">
            <sc-for list="{{ staticParas }}" as="p" hint-placeholder-count="3">
              <p style="margin: 0 0 20px 0; font-size: 15px; line-height: 1.8; color: #333333">{{ p }}</p>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noStaticImg }}" hint-placeholder-val="{{ true }}">
          <div style="max-width: 800px; margin: 0 auto; padding: 64px 24px 96px 24px">
            <h1 style="margin: 0 0 32px 0; font-size: 40px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em">{{ staticTitle }}</h1>
            <sc-for list="{{ staticParas }}" as="p" hint-placeholder-count="3">
              <p style="margin: 0 0 20px 0; font-size: 15px; line-height: 1.8; color: #333333">{{ p }}</p>
            </sc-for>
          </div>
        </sc-if>
      </section>
</x-dc>
</body>
</html>
